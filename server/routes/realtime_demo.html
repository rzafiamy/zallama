<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zallama Realtime</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e;
          --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--dim); flex:1 1 180px; }
  input, select, textarea { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  textarea { width:100%; min-height:56px; resize:vertical; }
  button { background:var(--accent); color:#04111f; border:0; border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer; font-size:15px; }
  button.stop { background: var(--bad); color: #fff; }
  #status { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:13px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--line); }
  .dot.on { background: var(--ok); } .dot.talk { background: var(--warn); }
  #log { display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 12px; border-radius:8px; max-width:85%; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#1f6feb33; border:1px solid #1f6feb66; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .tool { align-self:flex-start; color:var(--dim); font: 12px ui-monospace, monospace; }
  .lat { color: var(--dim); font-size: 11px; margin-top: 3px; }
  .warn { color: var(--warn); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Zallama Realtime</h1>
  <p class="sub">Speech-to-speech: Silero VAD → ASR → LLM (tools) → TTS, over <code>/v1/realtime</code>.</p>

  <div class="panel">
    <div class="row">
      <label>WebSocket URL <input id="url"></label>
      <label>API key (if any) <input id="key" type="password" autocomplete="off"></label>
      <label>Voice <select id="voice"><option value="">default</option></select></label>
    </div>
    <div class="row" style="margin-top:10px">
      <label style="flex-basis:100%">Instructions
        <textarea id="instr">Tu es Zal, un assistant vocal sympathique. Tu tutoies l'utilisateur.</textarea></label>
    </div>
    <p id="secure" class="warn" hidden>This page is not a secure context: browsers only allow the microphone over HTTPS or on localhost.</p>
    <div class="row" style="margin-top:10px; justify-content:space-between; align-items:center">
      <button id="go">Start talking</button>
      <div id="status"><span class="dot" id="dot"></span><span id="stxt">idle</span></div>
    </div>
  </div>

  <div class="panel"><div id="log"></div></div>
</main>

<script>
const $ = id => document.getElementById(id);
const RATE = 24000;
const proto = location.protocol === "https:" ? "wss:" : "ws:";
$("url").value = `${proto}//${location.host}/v1/realtime`;
try { $("key").value = localStorage.getItem("zrt-key") || ""; } catch {}
if (!window.isSecureContext) $("secure").hidden = false;
["estelle","jean","alba","marius","fantine","cosette","eponine","javert","charles","anna","eve","paul"]
  .forEach(v => $("voice").add(new Option(v, v)));

// Demo tools, run in the browser (the protocol runs tools on the client).
const TOOLS = [
  { type: "function", name: "get_time", description: "Current local date and time",
    parameters: { type: "object", properties: {} } },
  { type: "function", name: "get_weather", description: "Current weather for a city",
    parameters: { type: "object", properties: { city: { type: "string" } }, required: ["city"] } },
  { type: "function", name: "set_timer", description: "Start a countdown timer",
    parameters: { type: "object", properties: { seconds: { type: "number" } }, required: ["seconds"] } },
];
async function runTool(name, args) {
  if (name === "get_time") return { now: new Date().toLocaleString() };
  if (name === "get_weather") {
    const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&name=${encodeURIComponent(args.city)}`)).json();
    if (!g.results?.length) return { error: "unknown city" };
    const { latitude, longitude, name: city } = g.results[0];
    const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,wind_speed_10m,weather_code`)).json();
    return { city, ...w.current };
  }
  if (name === "set_timer") {
    setTimeout(() => { addMsg("tool", `⏰ timer (${args.seconds}s) done`); beep(); }, args.seconds * 1000);
    return { ok: true };
  }
  return { error: "unknown tool" };
}

let ws, ctx, micStream, node, playHead = 0, sources = [], current = null, botEl = null, t0 = 0;

function addMsg(cls, text) {
  const el = document.createElement("div"); el.className = "msg " + cls; el.textContent = text;
  $("log").appendChild(el); el.scrollIntoView({ block: "end" }); return el;
}
function setStatus(text, cls) { $("stxt").textContent = text; $("dot").className = "dot " + (cls || ""); }
function beep() {
  const o = ctx.createOscillator(); o.frequency.value = 880; o.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + 0.3);
}
const b64 = buf => { let s = ""; const u = new Uint8Array(buf);
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; };

function play(pcmBuf, itemId) {
  const i16 = new Int16Array(pcmBuf), f = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f[i] = i16[i] / 32768;
  const ab = ctx.createBuffer(1, f.length, RATE); ab.copyToChannel(f, 0);
  const src = ctx.createBufferSource(); src.buffer = ab; src.connect(ctx.destination);
  const start = Math.max(ctx.currentTime + 0.02, playHead);
  if (!current || current.itemId !== itemId) current = { itemId, start };
  src.start(start); playHead = start + ab.duration; sources.push(src);
  src.onended = () => { sources = sources.filter(s => s !== src); if (!sources.length) setStatus("listening", "on"); };
  setStatus("speaking", "talk");
}
function flushPlayback() {
  // Barge-in: stop what's queued, tell the server how much was heard.
  if (current && sources.length) {
    const ms = Math.max(0, Math.round((ctx.currentTime - current.start) * 1000));
    ws.send(JSON.stringify({ type: "conversation.item.truncate", item_id: current.itemId, content_index: 0, audio_end_ms: ms }));
  }
  sources.forEach(s => { try { s.stop(); } catch {} }); sources = []; playHead = 0; current = null;
}

const WORKLET = `class Mic extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(960); this.n = 0; }
  process(inputs) { const ch = inputs[0][0]; if (!ch) return true;
    for (let i = 0; i < ch.length; i++) { const v = Math.max(-1, Math.min(1, ch[i]));
      this.buf[this.n++] = v < 0 ? v * 32768 : v * 32767;
      if (this.n === this.buf.length) { this.port.postMessage(this.buf.buffer.slice(0)); this.n = 0; } }
    return true; } }
registerProcessor("mic", Mic);`;

async function start() {
  try { localStorage.setItem("zrt-key", $("key").value); } catch {}
  ctx = new AudioContext({ sampleRate: RATE });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
  micStream = await navigator.mediaDevices.getUserMedia({ audio: {
    channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  const protocols = ["realtime"];
  if ($("key").value) protocols.push("openai-insecure-api-key." + $("key").value);
  ws = new WebSocket($("url").value, protocols);
  setStatus("loading models…");
  ws.onclose = () => { setStatus("disconnected"); stop(true); };
  ws.onmessage = async e => {
    const ev = JSON.parse(e.data);
    switch (ev.type) {
      case "session.created":
        ws.send(JSON.stringify({ type: "session.update", session: {
          instructions: $("instr").value, tools: TOOLS,
          audio: { input: { format: { type: "audio/pcm", rate: RATE } }, output: { voice: $("voice").value } } } }));
        node = new AudioWorkletNode(ctx, "mic");
        node.port.onmessage = m => ws.readyState === 1 &&
          ws.send(JSON.stringify({ type: "input_audio_buffer.append", audio: b64(m.data) }));
        ctx.createMediaStreamSource(micStream).connect(node);
        setStatus("listening", "on"); $("go").textContent = "Stop"; $("go").className = "stop";
        break;
      case "input_audio_buffer.speech_started": flushPlayback(); setStatus("hearing you", "on"); break;
      case "input_audio_buffer.speech_stopped": t0 = performance.now(); break;
      case "conversation.item.input_audio_transcription.completed":
        if (ev.transcript) addMsg("user", ev.transcript); break;
      case "response.output_audio_transcript.delta":
        if (!botEl) botEl = addMsg("bot", ""); botEl.textContent += ev.delta; break;
      case "response.output_audio.delta":
        if (t0) { const lat = document.createElement("div"); lat.className = "lat";
          lat.textContent = `first audio ${Math.round(performance.now() - t0)} ms after you stopped (+${$("url").value.includes("localhost") ? 0 : "network"})`;
          (botEl || addMsg("bot", "")).after(lat); t0 = 0; }
        play(unb64(ev.delta), ev.item_id); break;
      case "response.function_call_arguments.done": {
        addMsg("tool", `→ ${ev.name}(${ev.arguments})`);
        let out; try { out = await runTool(ev.name, JSON.parse(ev.arguments || "{}")); } catch (err) { out = { error: String(err) }; }
        addMsg("tool", `← ${JSON.stringify(out)}`);
        ws.send(JSON.stringify({ type: "conversation.item.create", item: { type: "function_call_output", call_id: ev.call_id, output: JSON.stringify(out) } }));
        pendingTool = true; break; }
      case "response.done":
        botEl = null;
        if (pendingTool && ev.response.status === "completed") { t0 = performance.now(); ws.send(JSON.stringify({ type: "response.create" })); }
        pendingTool = false; break;
      case "error": addMsg("tool", "error: " + ev.error.message); break;
    }
  };
}
let pendingTool = false;
function stop(fromClose) {
  if (!fromClose && ws) ws.close();
  micStream?.getTracks().forEach(t => t.stop()); node?.disconnect(); ctx?.close();
  ws = ctx = node = micStream = null; sources = []; playHead = 0;
  $("go").textContent = "Start talking"; $("go").className = "";
}
$("go").onclick = () => ws ? stop(false) : start().catch(err => { addMsg("tool", "error: " + err.message); stop(false); });
</script>
</body>
</html>
