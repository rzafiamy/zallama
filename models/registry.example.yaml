# Zallama model registry — TEMPLATE.
#
# The LIVE registry lives beside your models at <models_dir>/registry.yaml
# (default ~/.zallama/models/registry.yaml) and is normally managed for you by
# `zallama pull` / `zallama add`. Edit it by hand only for advanced tweaks.
#
# Each entry:
#   name:        unique id, also the OpenAI "model" name and registry key
#   file:        primary gguf (absolute, or relative to models_dir)
#   modality:    text | embedding | rerank | asr | tts | image  (default: text)
#   backend:     which engine runs it               (optional, default: llama-server)
#   artifacts:   extra files (mmproj for vision, …) (optional)
#   params:      per-model overrides of llama_server.default_params (optional)
#   aliases:     alternate names that resolve to this entry (optional)
#   mem_gb:      declared memory cost for the LRU budget (optional)

models:
  # --- Plain text / chat model ------------------------------------------------
  - name: llama3.2-3b
    file: Llama-3.2-3B-Instruct-Q4_K_M.gguf
    description: "Llama 3.2 3B Instruct (Q4_K_M)"
    params:
      ctx_size: 8192
      n_gpu_layers: 99

  # --- Vision model: same backend, plus an mmproj projector -------------------
  # The projector is downloaded automatically by `zallama pull` for VL repos.
  # Local projector files are namespaced by model name to avoid collisions when
  # two repos ship a generically-named "mmproj-F16.gguf".
  - name: qwen2.5-vl-7b
    file: Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
    description: "Qwen2.5-VL 7B (vision)"
    artifacts:
      mmproj: qwen2.5-vl-7b.mmproj-F16.gguf
    params:
      ctx_size: 8192
      n_gpu_layers: 99

  # --- A big model squeezed onto a single GPU ---------------------------------
  # When a model does not fit next to what you keep resident, these are the
  # levers, cheapest first. Full trade-off tables in docs/vram-planning.md.
  #   * cache_type_k/v: q8_0  roughly halves KV memory, nearly free in quality
  #   * ctx_size              linear in KV — but on a big model the weights are
  #                           the floor, so check the arithmetic first
  #   * n_cpu_moe: N          MoE models only ("A3B"/"A4B"): keeps the expert
  #                           weights of the first N layers in system RAM while
  #                           attention and the KV cache stay on the GPU.
  #                           ~0.4 GB freed and ~8% of tok/s lost per layer.
  - name: qwen3.6-35b-a3b
    file: Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
    description: "Qwen3.6 35B-A3B (MoE) — 22 GB of weights on a 24 GB card"
    artifacts:
      mmproj: qwen3.6-35b-a3b.mmproj-BF16.gguf
    mem_gb: 21.9       # measured with n_cpu_moe=4; 23.4 without it
    params:
      ctx_size: 131072
      cache_type_k: q8_0
      cache_type_v: q8_0
      n_cpu_moe: 4     # frees 1.7 GB so a pinned ASR model still fits

  # --- ASR / speech-to-text: parakeet.cpp -------------------------------------
  # Served by parakeet-server (build with build-ggml-parakeet.cpp.sh, which
  # installs the binary into ./bin/). Exposed at POST /v1/audio/transcriptions,
  # OpenAI-compatible, multipart upload, WAV input.
  # Easiest path: `zallama pull parakeet:0.6b` downloads the gguf and writes this
  # entry for you. The file below matches mudler/parakeet-cpp-gguf.
  #
  # `pinned: true` pre-loads the model when the daemon starts and exempts it
  # from the idle sweep and from eviction. That is what you want for ASR/TTS:
  # a ~1 GB model that any chat request would otherwise evict, forcing a full
  # reload on the next transcription (~780 ms instead of ~80 ms). Beware that
  # pinned models still count against `max_loaded_models` — size that cap as
  # (pinned services) + (big models you want resident at once).
  #
  # `mem_gb` is the model's footprint for eviction accounting. MEASURE it
  # (`python3 scripts/measure_vram.py --write`): the fallback estimate is the
  # GGUF size x 1.2, which ignores the KV cache and the artifacts and is often
  # wrong by 100% or more. See docs/vram-planning.md.
  - name: parakeet:0.6b
    file: tdt-0.6b-v2-q8_0.gguf
    modality: asr
    backend: parakeet-server
    description: "NVIDIA Parakeet TDT 0.6B v2 (speech-to-text)"
    mem_gb: 1.3        # measured, not guessed
    pinned: true       # keep speech-to-text warm; never evicted
    params:
      threads: 4

  # --- RAG: embedding model ---------------------------------------------------
  # Runs llama-server in --embedding mode via the embedding-server backend and
  # serves POST /v1/embeddings. zvec uses this to embed & search documents; set
  # it as rag.embedding_model in config.yaml. `zallama pull nomic-embed:v1.5`
  # downloads it and writes this entry for you.
  # (Legacy entries that instead set `params: {embedding: true}` on a text model
  # still work — they are treated as the embedding modality at runtime.)
  - name: nomic-embed:v1.5
    file: nomic-embed-text-v1.5.Q4_K_M.gguf
    modality: embedding
    backend: embedding-server
    description: "Nomic Embed Text v1.5 (embeddings)"
    params:
      ctx_size: 4096
      n_gpu_layers: 99

  # --- RAG: reranker (cross-encoder) ------------------------------------------
  # Runs llama-server in --reranking mode via the rerank-server backend and is
  # exposed at POST /v1/rerank. zvec can use it to rerank query candidates; set
  # it as rag.rerank_model in config.yaml. `zallama pull bge-reranker:v2-m3`
  # downloads it and writes this entry for you.
  - name: bge-reranker:v2-m3
    file: bge-reranker-v2-m3-Q4_K_M.gguf
    modality: rerank
    backend: rerank-server
    description: "BGE Reranker v2-m3 (rerank, multilingual)"
    params:
      ctx_size: 4096
      n_gpu_layers: 99

  # --- Image Generation: stable-diffusion.cpp --------------------------------
  # Served by sd-server (build with build-ggml-stable-diffusion.cpp.sh).
  # Exposed at POST /v1/images/generations. Easiest path: `zallama pull sd:1.5`.
  - name: sd:1.5
    file: v1-5-pruned-emaonly.safetensors
    modality: image
    backend: sd-server
    description: "Stable Diffusion v1.5 (image generation)"
    params:
      steps: 20
      cfg_scale: 7.0
      # Decode the VAE in tiles. The decode buffer scales with the square of the
      # image size and is allocated once the weights are already resident, so
      # without this a large generation can sample every step and then fail at
      # the final decode with a cudaMalloc OOM. Costs nothing visible.
      vae_tiling: true

